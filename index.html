<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>증여세 계산기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sheet">

    <header class="sheet__head">
      <h1 class="sheet__title">증여세 계산기</h1>
      <p class="sheet__scope">부모 &rarr; 성인 자녀 &middot; 현금 증여 &middot; 기한 내 신고</p>
    </header>

    <section class="entry">
      <label class="entry__label" for="amount">증여받은 금액</label>
      <div class="entry__field">
        <input
          id="amount"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="0"
          maxlength="19"
          aria-describedby="amount-reading">
        <span class="entry__unit" aria-hidden="true">원</span>
      </div>
      <p id="amount-reading" class="entry__reading">금액을 입력해 주세요.</p>
    </section>

    <section class="ledger" aria-labelledby="ledger-caption">
      <h2 class="ledger__caption" id="ledger-caption">계산 내역</h2>
      <div id="ledger-body"></div>
    </section>

    <footer class="notes">
      <p class="notes__line">
        <span class="notes__key">신고기한</span>
        <span>증여일이 속하는 달의 말일부터 <strong>3개월 이내</strong></span>
      </p>
      <p class="notes__line notes__line--dim">
        <span class="notes__key">미반영</span>
        <span>10년 내 사전증여 합산 &middot; 세대생략 할증 &middot; 가산세</span>
      </p>
    </footer>

  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
